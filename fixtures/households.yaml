# 100% SYNTHETIC DATA. No real people. Phone numbers use the reserved
# +1555 fictional range. Do not add real household data to this file.
#
# This file is the demo: twelve households, nine clean renewals Grace files
# alone, three that must escalate for three distinct reasons. Every date is
# evaluated against the pinned TODAY = 2026-10-01 (tests/conftest.py), so all
# nine clean cases sit in an actionable window state (`open`, or `overdue` for
# c-002) and none of the nine trips a document, income, size, or source-conflict
# condition. `reported_income_cents` and `reported_size` are omitted wherever
# the family reported no change; the loader defaults them to the on-file values
# so an absent field can never read as a discrepancy against the household's
# own record.
#
# Note on c-002: its SNAP grace period ends 2026-10-30, so the case is `overdue`
# on the pinned date and `closed` from 2026-10-31. That is the intended demo of a
# late-but-still-savable renewal — and the reason a stray `date.today()` anywhere
# in the sweep turns 9-act/3-escalate into 8/4.
cases:
  - case_id: "c-001"
    program: "medicaid"
    state: "NY"
    cert_end: "2026-10-15"
    household: {household_id: "h-001", display_name: "The Rivera Household", language: "es", phone: "+15550000001", monthly_income_cents: 210000, size: 3}
    documents:
      - {id: "proof_of_income", received: "2026-09-20"}
      - {id: "proof_of_residency", received: "2026-03-01"}
  - case_id: "c-002"
    program: "snap"
    state: "NY"
    cert_end: "2026-09-30"
    household: {household_id: "h-002", display_name: "The Okonkwo Household", language: "en", phone: "+15550000002", monthly_income_cents: 148000, size: 4}
    documents:
      - {id: "proof_of_income", received: "2026-09-15"}
      - {id: "proof_of_identity", received: "2024-05-10"}
      - {id: "proof_of_expenses", received: "2026-08-20"}
  - case_id: "c-003"
    program: "medicaid"
    state: "NY"
    cert_end: "2026-10-31"
    household: {household_id: "h-003", display_name: "The Nguyen Household", language: "vi", phone: "+15550000003", monthly_income_cents: 302000, size: 5}
    documents:
