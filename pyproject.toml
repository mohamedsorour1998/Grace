[project]
name = "grace"
version = "0.1.0"
description = "An agent that keeps families from losing benefits over paperwork"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Sorour" }]

# Deliberately minimal. boto3 and pyyaml arrive transitively via
# strands-agents, but Grace imports both directly, so they are declared.
# strands-agents-tools is NOT a dependency: it pulls slack-bolt, pillow,
# beautifulsoup4, and sympy, none of which Grace uses.
dependencies = [
    # [otel] adds exactly one package, opentelemetry-exporter-otlp-proto-http.
    # The OTEL api/sdk are already base dependencies. Needed to export traces;
    # see Appendix E. aws-opentelemetry-distro is deliberately NOT here — that
    # is for agents hosted outside AgentCore Runtime, and Runtime instruments
    # itself.
    "strands-agents[otel]==1.54.0",
    # AgentCore Memory's Strands session manager lives here, NOT in
    # strands-agents — `strands.session` ships only file/s3/repository/snapshot.
    # Measured marginal cost against the existing venv: 2 packages
    # (bedrock-agentcore, websockets); everything else is already satisfied by
    # strands-agents. Smaller than the [otel] extra's 10, and first-party AWS.
    #
    # Pinned EXACTLY, and to 1.23.0 rather than the newest. 1.23.1+ import
    # `strands.experimental.bidi`, absent from strands-agents 1.54.0, and declare
    # `strands-agents>=1.56.0` only under their own `strands-agents` extra, which
    # this project does not install, so no resolver sees the conflict. The image
    # installs from this file, not from uv.lock, so a range here would let a
    # rebuild ship a container that dies at import. tests/test_dependency_pins.py.
    "bedrock-agentcore==1.23.0",
    "boto3>=1.43",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # The suite imports grace.a2a, so the documented `uv sync --extra dev`
    # must bring the A2A SDK too.
    "grace[a2a]",
]
# The A2A server (a2a_app.py, Dockerfile.a2a): the one dependency added after the
# hackathon. bedrock-agentcore's own `a2a` extra, at the same exact version as the
# base pin, plus a2a-sdk pinned exactly to the last 0.3.x (2026-04-09), which is
# the range that extra accepts. Measured cost and package names: CLAUDE.md,
# "Dependencies". Not installed in the HTTP runtime's image.
a2a = [
    "bedrock-agentcore[a2a]==1.23.0",
    "a2a-sdk[http-server]==0.3.26",
]
# NOT INSTALLED, and not part of `dev`. strands-agents-evals depends on
# strands-agents-tools, which drags in slack-bolt, slack-sdk, pillow,
# beautifulsoup4, and sympy — 25 packages, and exactly what the dependency
# rule in CLAUDE.md forbids. Task 8's trajectory evals are hand-written
# against the ledger for this reason. Kept here as a documented decision;
# if it is ever needed, install it into a throwaway venv, never this one.
# evals = ["strands-agents-evals"]

[tool.uv]
# The a2a extra pulls these in transitively, and their newest releases were
# younger than two weeks when it was added (2026-11-01). Each is held to its
# newest release on or before 2026-10-17. Raise a cap only to a release at least
# two weeks old -- EXCEPT a release that fixes a HIGH or CRITICAL finding of the
# CI image scan, which is taken at once and recorded here:
#   pyasn1 0.6.5 (2026-10-27): fixes four HIGH decoding CVEs in 0.6.4. Verified
#   upstream: same maintainer as 0.6.3/0.6.4, five commits, all removing
#   quadratic-time decoding. Drop this exception once it is two weeks old.
# The A2A image installs from uv.lock, so these reach it too.
constraint-dependencies = [
    "fastapi<=0.143.3",
    "google-api-core<=2.42.0",
    "pyasn1<=0.6.5",
]

[project.scripts]
grace = "grace.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
# CI runs `pytest -m "not live"` with no AWS credentials. `--strict-markers`
# makes a misspelt marker a collection error rather than a test that silently
# stops being deselected.
markers = ["live: calls real AWS services (Bedrock, DynamoDB); deselected in CI with -m 'not live'"]

[tool.ruff]
line-length = 100
target-version = "py312"
