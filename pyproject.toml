[project]
name = "grace"
version = "0.1.0"
description = "An agent that keeps families from losing benefits over paperwork"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Sorour" }]

# Deliberately minimal. boto3 and pyyaml arrive transitively via
# strands-agents, but Grace imports both directly, so they are declared.
# strands-agents-tools is NOT a dependency: it pulls slack-bolt, pillow,
# beautifulsoup4, and sympy, none of which Grace uses.
dependencies = [
    "strands-agents==1.54.0",
    "boto3>=1.43",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Installed only when running the eval suite: this package is git-unpinned
# upstream and its experimental APIs drift.
evals = [
    "strands-agents-evals",
]

[project.scripts]
grace = "grace.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
