[project]
name = "grace"
version = "0.1.0"
description = "An agent that keeps families from losing benefits over paperwork"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Sorour" }]

# Deliberately minimal. boto3 and pyyaml arrive transitively via
# strands-agents, but Grace imports both directly, so they are declared.
# strands-agents-tools is NOT a dependency: it pulls slack-bolt, pillow,
# beautifulsoup4, and sympy, none of which Grace uses.
dependencies = [
    # [otel] adds exactly one package, opentelemetry-exporter-otlp-proto-http.
    # The OTEL api/sdk are already base dependencies. Needed to export traces;
    # see Appendix E. aws-opentelemetry-distro is deliberately NOT here — that
    # is for agents hosted outside AgentCore Runtime, and Runtime instruments
    # itself.
    "strands-agents[otel]==1.54.0",
    "boto3>=1.43",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# NOT INSTALLED, and not part of `dev`. strands-agents-evals depends on
# strands-agents-tools, which drags in slack-bolt, slack-sdk, pillow,
# beautifulsoup4, and sympy — 25 packages, and exactly what the dependency
# rule in CLAUDE.md forbids. Task 8's trajectory evals are hand-written
# against the ledger for this reason. Kept here as a documented decision;
# if it is ever needed, install it into a throwaway venv, never this one.
# evals = ["strands-agents-evals"]

[project.scripts]
grace = "grace.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
