# Amplify build settings for the Grace caseworker dashboard.
#
# **The `applications:` / `appRoot:` form is mandatory here, not stylistic.**
# `AMPLIFY_MONOREPO_APP_ROOT` is set on the app (to `web`), and with that variable
# present Amplify rejects a flat single-app spec outright:
# `CustomerError: Monorepo spec provided without "applications" key`. Removing the
# variable instead is not an option — without it the build cannot find Next at all
# and fails at clone time with `Cannot read 'next' version in package.json`. So the
# two settings are a pair: keep both, or neither.
#
# **This file overrides the console's build settings**, which is why it lives in the
# repository: the console copy drifted out of sync with the monorepo variable and
# produced a failure that read like a packaging problem. A committed spec is
# reviewable, survives an accidental console edit, and changes with the code that
# needs it.
#
# **Paths are relative to `appRoot`.** In this form `web/` is already the working
# directory, so `baseDirectory` is `.next` and not `web/.next` — the single-app form
# needs the prefix because it runs from the repository root. And `.next` rather than
# `out` for Next 14+ regardless of SSG or SSR: `next export` was removed, and
# pointing at an `out/` directory fails with `cannot find required-server-files.json`.
#
# **The `.env.production` writes are what make environment variables reach the
# build.** Amplify exposes them to the build shell, but `next build` reads
# `.env.production` for values that must be present at build time. Note none of
# these are secrets — they name resources. There is no `AWS_REGION` here because
# Amplify rejects any variable starting with the reserved `AWS` prefix, and
# `readEnv` defaults the region anyway.
#
# **`nvm use 22` is required.** Amplify's build image ships Node 18, which Next
# 16.3.4 and `jose` 6 do not support.
#
# **The four gates run before `build`, deliberately.** A deploy that skips them can
# ship a broken authorization gate, and this application files benefit renewals —
# Task 6 found that the pages had no session verification at all. `npm run test`
# needs no AWS credentials: every test uses fakes, and `__live__/`, which does read
# DynamoDB, is excluded by `vitest.config.mts`.

version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - rm -f .env.production
            - echo "GRACE_TABLE_NAME=${GRACE_TABLE_NAME}" >> .env.production
            - echo "GRACE_ESCALATION_INDEX=${GRACE_ESCALATION_INDEX}" >> .env.production
            - echo "GRACE_RUNTIME_ARN=${GRACE_RUNTIME_ARN}" >> .env.production
            - echo "COGNITO_ISSUER=${COGNITO_ISSUER}" >> .env.production
            - echo "COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}" >> .env.production
            - echo "COGNITO_DOMAIN=${COGNITO_DOMAIN}" >> .env.production
            - echo "DASHBOARD_URL=${DASHBOARD_URL}" >> .env.production
            - npm run typecheck
            - npm run lint
            - npm run test
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
